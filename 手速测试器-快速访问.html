<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手速测试器 - 快速访问</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.3);
        }
        
        .card-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            background: linear-gradient(to right, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .card-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 25px;
        }
        
        .card-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .feature-tag {
            background: linear-gradient(135deg, #667eea20, #764ba220);
            color: #667eea;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .card-button {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .card-footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #999;
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            
            .card-title {
                font-size: 1.5rem;
            }
            
            .card-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <a href="http://localhost:8082/AI操作/index.html" class="card">
        <div class="card-icon">👆</div>
        <h1 class="card-title">手速测试器</h1>
        <p class="card-subtitle">专业手速分析与训练系统</p>
        
        <div class="card-features">
            <span class="feature-tag">实时统计</span>
            <span class="feature-tag">历史记录</span>
            <span class="feature-tag">数据分析</span>
            <span class="feature-tag">深色模式</span>
            <span class="feature-tag">目标设定</span>
        </div>
        
        <div class="card-button">点击开始测试 →</div>
        
        <p class="card-footer">本地服务器: localhost:8082</p>
    </a>
</body>
</html>
